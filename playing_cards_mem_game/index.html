<!DOCTYPE html>
<html>
<head>
	<title>Card Matching Game</title>
	<link rel="icon" type="image/png" href="../common_mem_game/images/favicon-pal.png">
	<!-- common -->
	<link rel="stylesheet" href="../common_mem_game/style/Montserrat.css"> 
	<link rel="stylesheet" href="../common_mem_game/style/style.css"> 
	<!-- custom css -->
	<link rel="stylesheet" href="style/style.css"> 
	<!-- js -->
	<script src="../common_mem_game/js/lib/jquery.js"></script>
	<script src="../common_mem_game/js/common.js"></script>
	<script type="module" src="js/main.js"></script>
	<meta name="viewport" content="width=device-width, user-scalable=no">
</head>
<body>
	<div class="wrap">
		<div class="game-title green-title">Card Matching Game</div>
		<div class="game"></div>
		<div class="bottom-btns">
			<div class="big-green-btn" id="back">BACK</div>
			<div class="big-green-btn" id="next">NEXT</div>
			
		</div>
		<div class="modal-overlay">
			<div class="modal">
				<h2 class="winner">Very well!</h2>
				<img src="../common_mem_game/images/trophy.svg">
				<button class="next">BACK</button>
			</div>
		</div>
	</div>
</body>
</html>
