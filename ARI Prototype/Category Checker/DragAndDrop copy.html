
<!DOCTYPE HTML>
<html>
 
<head>
    <title>Category Checker</title>
    <script>

    var cueIdx = 0;
    var numCorrect = 0;
    var startTime = new Date();
    var endTime;

    var cues = [
        {
            img: "Cues/Highland_Cow.jpg",
            id: "Animals",
        },
        
        {
            img: "Cues/Quiche.jpg",
            id: "Food",
        },

        {
            img: "Cues/Horse.png",
            id: "Animals",
        },

        {
            img: "Cues/USA.png",
            id: "Countries",
        },

        {
            img: "Cues/Sushi.jpeg",
            id: "Food",
        },

        {
            img: "Cues/Japan.png",
            id: "Countries",
        },

        {
            img: "Cues/Burger.jpg",
            id: "Food",
        },

        {
            img: "Cues/Germany.png",
            id: "Countries",
        },

        {
            img: "Cues/Breakfast.jpg",
            id: "Food",
        },

        {
            img: "Cues/Cupcake.jpg",
            id: "Food",
        },

        {
            img: "Cues/France.png",
            id: "Countries",
        },

        ];



    const express = require('express')
    const request = require('request');

    app = express();
    const PORT = 3000;

    app.get('/home', function(req, res) {
        request('http://127.0.0.1:5000/flask', function (error, response, body) {
            console.error('error:', error); // Print the error
            console.log('statusCode:', response && response.statusCode); // Print the response status code if a response was received
            console.log('body:', body); // Print the data received
            res.send(body); //Display the response on the website
          });      
    });

    app.listen(PORT, function (){ 
        console.log('Listening on Port 3000');
    });  



    function end() {
      endTime = new Date();
      var timeDiff = endTime - startTime; //in ms
      // strip the ms
      timeDiff /= 1000;

      // get seconds 
      var seconds = Math.round(timeDiff);
      console.log("Elapsed Time: " + seconds + " seconds");
    }


    function allowDrop(ev) {
        ev.preventDefault();
    }
 
    function dragStart(ev) {
        ev.dataTransfer.setData("text", ev.target.id);
    }
 
    function dragDrop(ev) {
        ev.preventDefault();
        // var data = ev.dataTransfer.getData("text");
        // ev.target.appendChild(document.getElementById(data));
        if(cues[cueIdx].id==ev.target.id){

            numCorrect++;
            var audio = new Audio('correct.mp3');
            audio.play();
        }
        console.log(cues.length);
        
        
        cueIdx++;
        if(cueIdx==cues.length){
            end();
            console.log("Score: " + numCorrect);
            var video = document.getElementById('video');
            video.setAttribute('src', 'Fireworks.mp4');
            video.setAttribute('top', '50%');
            video.setAttribute('left', '50%');
            video.setAttribute('width', '800px');
            video.setAttribute('height', 'auto');
            video.play();
        }
        else{
            document.getElementById("Cue").src=cues[cueIdx].img;
            document.getElementById("Cue").style.top=70 + "%";  
        }
        
    }
    </script>
    <style>

    .horizontal-flex-container {

</head>
 
<body>
    <div class="gfg">Category Checker</div>
     
<p>Drag the object in the bottom row to the category it falls under.</p>

        <div class="horizontal-flex-container">

            <div class="img-container">
        		<img style='border:6px solid #42f593' src="Categories/Food.jpg" alt="Food" id="Food" ondrop="dragDrop(event)"
                     ondragover="allowDrop(event)"
                />

            </div>

            <div class="img-container">
                <img style='border:6px solid #B5D5F5' src="Categories/Animals.jpg" alt="Animals" id="Animals"  ondrop="dragDrop(event)"
                     ondragover="allowDrop(event)"
                />
