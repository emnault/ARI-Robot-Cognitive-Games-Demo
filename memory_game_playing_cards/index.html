<!DOCTYPE html>
<html>
<head>
	<title>Memory game</title>
	<link rel="icon" type="image/png" href="../ari_spring_common/images/favicon-pal.png">
	<!-- common -->
	<link rel="stylesheet" href="../ari_spring_common/style/Montserrat.css"> 
	<link rel="stylesheet" href="../ari_spring_common/style/style.css"> 
	<!-- custom css -->
	<link rel="stylesheet" href="style/style.css"> 
	<!-- js -->
	<script src="../ari_spring_common/js/lib/jquery.js"></script>
	<script src="../ari_spring_common/js/common.js"></script>
	<script type="module" src="js/main.js"></script>
	<meta name="viewport" content="width=device-width, user-scalable=no">
</head>
<body>
	<div class="wrap">
		<div class="game-title green-title">Memory game</div>
		<div class="game"></div>
		<div class="bottom-btns">
			<div class="big-green-btn" id="restart">START</div>
			<div class="big-green-btn" id="exit">RETURN</div>
		</div>
		<div class="modal-overlay">
			<div class="modal">
				<h2 class="winner">Very well!</h2>
				<img src="../ari_spring_common/images/trophy.svg">
				<button class="restart">RETURN</button>
			</div>
		</div>
	</div>
</body>
</html>
